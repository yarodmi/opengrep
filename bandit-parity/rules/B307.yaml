rules:
  - id: B307
    languages: [python]
    severity: WARNING
    message: Use ast.literal_eval instead of eval (Bandit B307).
    options:
      constant_propagation: false
    patterns:
      # Bandit nosec IDs and plugin names, without treating strings as comments.
      - pattern-not-regex: >-
          (?m)^(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|[^#'"\n])*#(?:[^\n]*#)?[ \t]*nosec:?[ \t]*(?:[^#\n]*(?<!\w)(?:B307|eval)(?!\w)|(?![^#\n]*(?<!\w)(?:B001|B101|B102|B103|B104|B105|B106|B107|B108|B110|B112|B113|B201|B202|B301|B302|B303|B304|B305|B306|B307|B308|B310|B311|B312|B313|B314|B315|B316|B317|B318|B319|B321|B323|B324|B401|B402|B403|B404|B405|B406|B407|B408|B409|B411|B412|B413|B415|B501|B502|B503|B504|B505|B506|B507|B508|B509|B601|B602|B603|B604|B605|B606|B607|B608|B609|B610|B611|B612|B613|B614|B615|B701|B702|B703|B704|any_other_function_with_shell_equals_true|assert_used|cipher_modes|ciphers|django_extra_used|django_mark_safe|django_rawsql_used|eval|exec_used|flask_debug_true|ftplib|hardcoded_bind_all_interfaces|hardcoded_password_default|hardcoded_password_funcarg|hardcoded_password_string|hardcoded_sql_expressions|hardcoded_tmp_directory|hashlib_insecure_functions|huggingface_unsafe_download|import_ftplib|import_httpoxy|import_pickle|import_pycrypto|import_pyghmi|import_subprocess|import_telnetlib|import_xml_etree|import_xml_expat|import_xml_minidom|import_xml_pulldom|import_xml_sax|import_xmlrpclib|jinja2_autoescape_false|linux_commands_wildcard_injection|logging_config_insecure_listen|mark_safe|markupsafe_markup_xss|marshal|md5|mktemp_q|paramiko_calls|pickle|pytorch_load|random|request_with_no_cert_validation|request_without_timeout|set_bad_file_permissions|snmp_insecure_version|snmp_weak_cryptography|ssh_no_host_key_verification|ssl_with_bad_defaults|ssl_with_bad_version|ssl_with_no_version|start_process_with_a_shell|start_process_with_no_shell|start_process_with_partial_path|subprocess_popen_with_shell_equals_true|subprocess_without_shell_equals_true|tarfile_unsafe_members|telnetlib|trojansource|try_except_continue|try_except_pass|unverified_context|urllib_urlopen|use_of_mako_templates|weak_cryptographic_key|xml_bad_ElementTree|xml_bad_cElementTree|xml_bad_expatbuilder|xml_bad_expatreader|xml_bad_minidom|xml_bad_pulldom|xml_bad_sax|yaml_load)(?!\w))[^#\n]*)
      - pattern: eval(...)
